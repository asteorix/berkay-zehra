<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff8fbb">
<title>Berkay ❤️ Zehra</title>
<style>
*{box-sizing:border-box}
:root{
    --pink:#ff4f91;
    --pink2:#ff78aa;
    --deep:#b92763;
    --text:#64233f;
    --muted:#9a5571;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% 15%,rgba(255,255,255,.9) 0 3px,transparent 4px),
      radial-gradient(circle at 88% 22%,rgba(255,255,255,.7) 0 4px,transparent 5px),
      radial-gradient(circle at 20% 82%,rgba(255,255,255,.55) 0 3px,transparent 4px),
      linear-gradient(145deg,#fff0f6 0%,#ffd9e8 45%,#ffbdd8 100%);
}
body:before{
    content:"";position:fixed;inset:-30%;
    background:radial-gradient(circle,rgba(255,255,255,.35),transparent 55%);
    animation:aurora 8s ease-in-out infinite alternate;
    pointer-events:none;
}
.app{position:relative;width:100%;height:100svh;display:grid;place-items:center;padding:20px}
.card{
    position:relative;z-index:5;width:min(92vw,440px);padding:34px 24px 27px;
    text-align:center;border:1px solid rgba(255,255,255,.85);border-radius:32px;
    background:rgba(255,255,255,.66);box-shadow:0 25px 80px rgba(168,38,91,.19);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    transition:transform .5s ease,opacity .5s ease;
}
.names{font-size:12px;font-weight:800;letter-spacing:2.4px;color:var(--deep);margin-bottom:21px}
.heart-main{
    width:76px;height:76px;margin:0 auto 19px;display:grid;place-items:center;
    border-radius:50%;color:#fff;font-size:35px;
    background:linear-gradient(145deg,#ff83b2,#ed3d82);
    box-shadow:0 13px 32px rgba(239,61,130,.28);
    animation:heartbeat 2.1s infinite;
}
h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.12;color:#5c1e3a}
.subtitle{margin:12px 0 24px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.buttons{position:relative;min-height:135px;display:flex;justify-content:center;align-items:center;gap:13px}
button{
    border:0;font:inherit;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;white-space:nowrap;
}
#yesBtn{
    position:relative;z-index:3;padding:15px 28px;border-radius:999px;color:white;
    background:linear-gradient(135deg,#ff5c9a,#e9347a);
    box-shadow:0 12px 27px rgba(220,47,114,.28);
    transform-origin:center;transition:transform .4s cubic-bezier(.2,.9,.2,1),box-shadow .3s;
}
#yesBtn:active{box-shadow:0 5px 15px rgba(220,47,114,.2)}
#noBtn{
    position:relative;z-index:4;padding:13px 23px;border-radius:999px;color:#99516d;background:#fff;
    box-shadow:0 9px 20px rgba(150,58,94,.13);
    transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),transform .3s,opacity .3s;
}
.hint{min-height:25px;margin-top:0;font-size:13.5px;font-weight:800;color:#c23870;transition:.2s}
.date{margin-top:19px;font-size:10px;letter-spacing:2.2px;color:#b2768e}
.floating-heart{
    position:fixed;bottom:-45px;z-index:1;pointer-events:none;opacity:.7;
    animation:floatUp linear forwards;filter:drop-shadow(0 4px 7px rgba(210,52,112,.12))
}
.message-pop{
    position:fixed;z-index:2;pointer-events:none;font-size:13px;font-weight:800;
    color:rgba(169,42,91,.86);animation:popMessage 2.6s ease-out forwards;white-space:nowrap
}
.sparkle{
    position:fixed;z-index:1;pointer-events:none;color:rgba(255,255,255,.9);
    animation:sparkle 1.8s ease-out forwards
}
.final{display:none;position:relative;z-index:10;width:min(92vw,450px);text-align:center}
.final.show{animation:finalIn 1s cubic-bezier(.2,.9,.2,1) forwards}
.final-card{
    padding:37px 25px 31px;border:1px solid rgba(255,255,255,.85);border-radius:32px;
    background:rgba(255,255,255,.7);box-shadow:0 25px 85px rgba(168,38,91,.2);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.final-heart{font-size:70px;line-height:1;margin-bottom:12px;animation:heartbeat 1.6s infinite}
.final h2{margin:0;font-size:clamp(34px,9vw,48px);color:#c92768}
.final .lead{margin:17px 0 0;font-size:17px;line-height:1.7;color:#74324f;font-weight:650}
.divider{display:flex;align-items:center;gap:10px;margin:23px auto;width:78%;color:#d34c7c}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#e89ab7,transparent)}
.story{
    padding:15px 13px;border-radius:20px;background:rgba(255,239,246,.75);
    color:#8d4965;font-size:13px;line-height:1.55
}
.story strong{display:block;color:#c12d69;font-size:14px;margin-bottom:4px}
.final-sign{margin-top:21px;font-size:15px;font-weight:800;color:#8d3d5d}
.final-date{margin-top:8px;font-size:11px;letter-spacing:2px;color:#b05c7e}
.back-btn{
    margin-top:22px;padding:11px 19px;border-radius:999px;
    background:rgba(255,255,255,.78);color:#a04d6d;
    border:1px solid rgba(193,45,105,.12);font-size:13px;
    box-shadow:0 7px 16px rgba(150,58,94,.09);
}
.back-btn:active{transform:scale(.96)}
.fade-out{animation:cardOut .55s ease forwards}

@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.1)}24%{transform:scale(1)}38%{transform:scale(1.07)}}
@keyframes aurora{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.08)}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:0}12%{opacity:.7}100%{transform:translateY(-115vh) rotate(28deg);opacity:0}}
@keyframes popMessage{0%{transform:translateY(12px) scale(.8);opacity:0}15%{opacity:1}76%{opacity:.9}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes sparkle{0%{transform:scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.5) rotate(120deg) translateY(-30px);opacity:0}}
@keyframes finalIn{from{opacity:0;transform:translateY(28px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardOut{to{opacity:0;transform:scale(.88) translateY(12px)}}

@media(max-height:650px){
 .card{padding:24px 21px 20px}.heart-main{width:58px;height:58px;font-size:27px;margin-bottom:12px}
 .subtitle{margin-bottom:13px}.buttons{min-height:110px}.date{margin-top:10px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="card" id="card">
    <div class="names">BERKAY ❤️ ZEHRA</div>
    <div class="heart-main">♥</div>
    <h1>Beni seviyor musun?</h1>
    <p class="subtitle" id="subtitle">Sana çok önemli bir soru sormam gerekiyor...</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Evet ❤️</button>
      <button id="noBtn">Hayır</button>
    </div>

    <div class="hint" id="hint"></div>
    <div class="date">18.10.2025</div>
  </div>

  <div class="final" id="final">
    <div class="final-card">
      <div class="final-heart">💗</div>
      <h2>Biliyordum!</h2>
      <p class="lead">
        Zehra,<br>
        seni çok seviyorum. ❤️<br>
        İyi ki varsın, iyi ki benimlesin.
      </p>
      <div class="divider">♥</div>
      <div class="story">
        <strong>Hikâyemizin başlangıcı</strong>
        18.10.2025<br>
        Ve umarım bu sadece başlangıçtır.
      </div>
      <div class="final-sign">Berkay'dan, Zehra'ya ❤️</div>
      <div class="final-date">18.10.2025 · DAİMA</div>
      <button class="back-btn" id="backBtn">↩ Baştan Dön</button>
    </div>
  </div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const hint=document.getElementById("hint");
const subtitle=document.getElementById("subtitle");
const card=document.getElementById("card");
const final=document.getElementById("final");
const app=document.getElementById("app");
const buttons=document.getElementById("buttons");

let noCount=0;

const messages=[
 "Emin misin Zehra? 🥺",
 "Bir daha düşün bence...",
 "Berkay'ın kalbi kırılıyor 💔",
 "Zehra... gerçekten mi? 😭",
 "Bak, hâlâ bir şansın var.",
 "Bu cevap hiç hoşuma gitmedi...",
 "Bence yanlış butona basıyorsun.",
 "ZEHRA YAPMA 😭",
 "Berkay şu an köşede ağlıyor...",
 "Bok kafalı, EVET'E BAS. ❤️"
];

function createHeart(){
 const el=document.createElement("div");
 el.className="floating-heart";
 el.textContent=["♥","♡","❤","💗","💕"][Math.floor(Math.random()*5)];
 el.style.left=Math.random()*100+"vw";
 el.style.fontSize=14+Math.random()*25+"px";
 el.style.animationDuration=5+Math.random()*5+"s";
 app.appendChild(el);
 setTimeout(()=>el.remove(),11000);
}
setInterval(createHeart,650);

function createSparkle(){
 const el=document.createElement("div");
 el.className="sparkle";
 el.textContent=["✦","✧","·"][Math.floor(Math.random()*3)];
 el.style.left=Math.random()*100+"vw";
 el.style.top=Math.random()*100+"vh";
 el.style.fontSize=10+Math.random()*14+"px";
 app.appendChild(el);
 setTimeout(()=>el.remove(),1900);
}
setInterval(createSparkle,900);

function popMessage(text){
 const el=document.createElement("div");
 el.className="message-pop";
 el.textContent=text;
 el.style.left=Math.max(4,Math.min(72,Math.random()*75))+"vw";
 el.style.top=Math.max(9,Math.min(82,Math.random()*72))+"vh";
 app.appendChild(el);
 setTimeout(()=>el.remove(),2700);
}

function noClicked(){
 noCount++;
 const index=Math.min(noCount-1,messages.length-1);
 hint.textContent=messages[index];
 popMessage(messages[index]);

 // Her hayırda Evet büyür.
 const scale=Math.min(1+noCount*.17,3.05);
 yesBtn.style.transform=`scale(${scale})`;
 yesBtn.style.boxShadow=`0 ${12+noCount}px ${27+noCount*2}px rgba(220,47,114,.30)`;

 // İlk birkaç tıklamadan sonra Hayır kaçmaya başlar.
 

 if(noCount>=3)
   subtitle.textContent="Zehra, bu sorunun cevabını tekrar değerlendirebilirsin...";
 if(noCount>=5){
   noBtn.style.transform=`rotate(${Math.random()*16-8}deg) scale(${Math.max(.68,1-(noCount-4)*.09)})`;
 }
 if(noCount>=7){
   noBtn.style.opacity=String(Math.max(.4,1-(noCount-6)*.12));
 }
 if(noCount>=9){
   yesBtn.textContent="EVET ❤️";
   yesBtn.style.padding="18px 35px";
 }
 if(noCount>=10) noBtn.textContent="Tamam 😭";

 // Sonraki denemelerde kaçmayı daha belirgin yap.
 
}

function yesClicked(){
 card.classList.add("fade-out");
 setTimeout(()=>{
   card.style.display="none";
   final.style.display="block";
   final.classList.add("show");
   for(let i=0;i<34;i++) setTimeout(createHeart,i*75);
   for(let i=0;i<18;i++) setTimeout(createSparkle,i*90);
 },500);
}

function resetPage(){
    noCount=0;
    hint.textContent="";
    subtitle.textContent="Sana çok önemli bir soru sormam gerekiyor...";
    yesBtn.textContent="Evet ❤️";
    yesBtn.style.transform="scale(1)";
    yesBtn.style.padding="15px 28px";
    yesBtn.style.boxShadow="0 12px 27px rgba(220,47,114,.28)";
    noBtn.textContent="Hayır";
    noBtn.style.transform="scale(1)";
    noBtn.style.opacity="1";

    final.classList.remove("show");
    final.style.display="none";
    card.style.display="block";
    card.classList.remove("fade-out");
    void card.offsetWidth;
}

noBtn.addEventListener("click",noClicked);
yesBtn.addEventListener("click",yesClicked);
document.getElementById("backBtn").addEventListener("click",resetPage);



// Dokunma başlamadan önce de küçük bir kaçış hissi.
noBtn.addEventListener("pointerenter",()=>{
 
});
</script>
</body>
</html>
