<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berkay ❤️ Zehra</title>
<style>
    * { box-sizing: border-box; }

    :root {
        --pink: #ff4f91;
        --deep-pink: #d92f72;
        --soft-pink: #ffd6e6;
        --text: #6d2946;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.9) 0 5%, transparent 6%),
            radial-gradient(circle at 80% 75%, rgba(255,255,255,.55) 0 7%, transparent 8%),
            linear-gradient(135deg, #ffeaf3 0%, #ffd1e3 48%, #ffb9d4 100%);
    }

    .app {
        position: relative;
        width: 100%;
        height: 100svh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
    }

    .card {
        position: relative;
        z-index: 5;
        width: min(92vw, 430px);
        padding: 38px 25px 32px;
        text-align: center;
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 30px;
        background: rgba(255,255,255,.68);
        box-shadow: 0 22px 60px rgba(183, 44, 100, .18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: .45s ease;
    }

    .names {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.8px;
        color: var(--deep-pink);
        margin-bottom: 24px;
    }

    .heart-main {
        width: 74px;
        height: 74px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #ff78aa, #f03f82);
        color: white;
        font-size: 34px;
        box-shadow: 0 12px 28px rgba(240,63,130,.3);
        animation: pulse 2s infinite;
    }

    h1 {
        margin: 0;
        font-size: clamp(27px, 7vw, 36px);
        line-height: 1.15;
        color: #5d203b;
    }

    .subtitle {
        margin: 13px 0 28px;
        font-size: 15px;
        line-height: 1.55;
        color: #94526d;
    }

    .buttons {
        position: relative;
        min-height: 126px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
    }

    button {
        border: 0;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    #yesBtn {
        position: relative;
        z-index: 3;
        padding: 15px 28px;
        border-radius: 999px;
        color: white;
        background: linear-gradient(135deg, #ff5c9a, #e9347a);
        box-shadow: 0 10px 24px rgba(220,47,114,.25);
        transform-origin: center;
        transition: transform .35s ease, padding .35s ease, font-size .35s ease;
    }

    #noBtn {
        position: relative;
        z-index: 4;
        padding: 13px 24px;
        border-radius: 999px;
        color: #9b5670;
        background: #fff;
        box-shadow: 0 8px 18px rgba(150,58,94,.12);
        transition: transform .25s ease, opacity .25s ease;
    }

    .hint {
        min-height: 28px;
        margin-top: 5px;
        font-size: 14px;
        font-weight: 700;
        color: #c33b70;
        transition: opacity .2s ease;
    }

    .date {
        margin-top: 23px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #b2768e;
    }

    .floating-heart {
        position: fixed;
        bottom: -40px;
        z-index: 1;
        pointer-events: none;
        opacity: .7;
        animation: floatUp linear forwards;
    }

    .message-pop {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        font-size: 14px;
        font-weight: 800;
        color: rgba(171, 43, 91, .82);
        animation: popMessage 2.7s ease-out forwards;
        white-space: nowrap;
    }

    .final {
        display: none;
        position: relative;
        z-index: 10;
        width: min(92vw, 430px);
        text-align: center;
        animation: finalIn .9s ease forwards;
    }

    .final-heart {
        font-size: 74px;
        margin-bottom: 12px;
        animation: pulse 1.5s infinite;
    }

    .final h2 {
        margin: 0;
        font-size: clamp(32px, 9vw, 46px);
        color: #c92768;
    }

    .final p {
        margin: 20px 0 0;
        font-size: 17px;
        line-height: 1.75;
        color: #74324f;
        font-weight: 600;
    }

    .final-date {
        margin-top: 27px;
        font-size: 13px;
        letter-spacing: 2px;
        color: #b05c7e;
    }

    .fade-out {
        animation: cardOut .55s ease forwards;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        12% { opacity: .7; }
        100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }

    @keyframes popMessage {
        0% { transform: translateY(10px) scale(.8); opacity: 0; }
        15% { opacity: 1; }
        75% { opacity: .9; }
        100% { transform: translateY(-70px) scale(1); opacity: 0; }
    }

    @keyframes finalIn {
        from { opacity: 0; transform: translateY(25px) scale(.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cardOut {
        to { opacity: 0; transform: scale(.9); }
    }

    @media (max-height: 650px) {
        .card { padding: 25px 22px 22px; }
        .heart-main { width: 58px; height: 58px; font-size: 27px; margin-bottom: 13px; }
        .subtitle { margin-bottom: 17px; }
        .date { margin-top: 12px; }
    }
</style>
</head>
<body>

<div class="app" id="app">
    <div class="card" id="card">
        <div class="names">BERKAY ❤️ ZEHRA</div>

        <div class="heart-main">♥</div>

        <h1>Beni seviyor musun?</h1>

        <p class="subtitle" id="subtitle">
            Sana çok önemli bir soru sormam gerekiyor...
        </p>

        <div class="buttons">
            <button id="yesBtn">Evet ❤️</button>
            <button id="noBtn">Hayır</button>
        </div>

        <div class="hint" id="hint"></div>

        <div class="date">18.10.2025</div>
    </div>

    <div class="final" id="final">
        <div class="final-heart">💗</div>
        <h2>Biliyordum!</h2>
        <p>
            Zehra,<br>
            seni çok seviyorum. ❤️<br><br>
            Bu küçük şeyi sadece yüzünde<br>
            bir gülümseme oluşturmak için yaptım.
        </p>
        <div class="final-date">BERKAY ❤️ ZEHRA · 18.10.2025</div>
    </div>
</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");
    const subtitle = document.getElementById("subtitle");
    const card = document.getElementById("card");
    const final = document.getElementById("final");
    const app = document.getElementById("app");

    let noCount = 0;

    const messages = [
        "Emin misin Zehra? 🥺",
        "Bir daha düşün bence...",
        "Berkay'ın kalbi kırılıyor 💔",
        "Zehra... gerçekten mi? 😭",
        "Bak, hâlâ bir şansın var.",
        "Bu cevap hiç hoşuma gitmedi...",
        "Bence yanlış butona basıyorsun.",
        "ZEHRA YAPMA 😭",
        "Berkay şu an köşede ağlıyor...",
        "Bok kafalı, EVET'E BAS. ❤️"
    ];

    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.textContent = ["♥", "♡", "❤", "💗"][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (14 + Math.random() * 25) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        app.appendChild(heart);
        setTimeout(() => heart.remove(), 11000);
    }

    setInterval(createHeart, 700);

    function popMessage(text) {
        const el = document.createElement("div");
        el.className = "message-pop";
        el.textContent = text;
        el.style.left = Math.max(4, Math.min(68, Math.random() * 72)) + "vw";
        el.style.top = Math.max(10, Math.min(82, Math.random() * 70)) + "vh";
        app.appendChild(el);
        setTimeout(() => el.remove(), 2800);
    }

    function noClicked() {
        noCount++;

        const index = Math.min(noCount - 1, messages.length - 1);
        hint.textContent = messages[index];
        popMessage(messages[index]);

        // Evet butonu her "Hayır" cevabında büyür.
        const scale = Math.min(1 + noCount * 0.16, 2.7);
        yesBtn.style.transform = `scale(${scale})`;

        if (noCount >= 3) {
            subtitle.textContent = "Zehra, bu sorunun cevabını tekrar değerlendirebilirsin...";
        }

        if (noCount >= 5) {
            noBtn.style.transform = `scale(${Math.max(.72, 1 - (noCount - 4) * .11)})`;
        }

        if (noCount >= 7) {
            noBtn.style.opacity = String(Math.max(.45, 1 - (noCount - 6) * .12));
        }

        if (noCount >= 9) {
            yesBtn.textContent = "EVET ❤️";
            yesBtn.style.padding = "18px 34px";
        }

        if (noCount >= 10) {
            noBtn.textContent = "Tamam 😭";
        }
    }

    function yesClicked() {
        card.classList.add("fade-out");

        setTimeout(() => {
            card.style.display = "none";
            final.style.display = "block";

            for (let i = 0; i < 24; i++) {
                setTimeout(createHeart, i * 90);
            }
        }, 500);
    }

    noBtn.addEventListener("click", noClicked);
    yesBtn.addEventListener("click", yesClicked);
</script>

</body>
</html>
